<div class="category-container" style="max-width: 1200px; margin: 40px auto; padding: 0 20px;">
  <h1 class="category-title" style="font-size: 36px; text-align: center; margin-bottom: 40px;">{{ .Title }}</h1>

  <!-- Subcategories Grid -->
  <div class="subcategories-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;">
    {{ range .Sections }}
      <a href="{{ .RelPermalink }}" class="subcategory-card" style="text-decoration: none; color: inherit; display: block;">
        <div class="card-image-wrap" style="aspect-ratio: 3/4; overflow: hidden; background: #f5f5f5;">
          {{ with .Params.image }}
            <img src="{{ . }}" alt="{{ $.Title }}" style="width: 100%; height: 100%; object-fit: cover;">
          {{ end }}
        </div>
        <h3 style="margin-top: 15px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px;">{{ .Title }}</h3>
      </a>
    {{ end }}
  </div>
</div>
