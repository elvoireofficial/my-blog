<header class="site-header" id="siteHeader">

  <!-- ========== FASHION HEADER BLOCK ========== -->
  <div class="fashion-header-block" id="fashionHeaderBlock">

    <!-- Mobile-only white switch bar -->
    <div class="fashion-promo-bar">
      <button class="mode-switch">
        <span class="switch-label active" data-value="fashion">Fashion</span>
        <span class="switch-divider">/</span>
        <span class="switch-label" data-value="beauty">Beauty</span>
      </button>
    </div>

    <div class="top-bar">

      <button class="nav-toggle" id="navToggleFashion" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>

      <div class="switch-wrapper">
        <button class="mode-switch">
          <span class="switch-label active" data-value="fashion">Fashion</span>
          <span class="switch-divider">/</span>
          <span class="switch-label" data-value="beauty">Beauty</span>
        </button>
      </div>

      <div class="logo-wrapper">
        <a href="/" class="site-logo">ÉLVOIRE</a>
      </div>

      <div class="search-wrapper">
        <button class="search-icon" id="searchToggleFashion" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </div>

    <nav class="fashion-nav-row" id="fashionNavRow">
      <a href="/" class="nav-logo-small">ÉLVOIRE</a>
      <ul class="nav-links fashion-nav" id="fashionNav">
        <li><a href="#">Monogram 130 <span class="nav-arrow">›</span></a></li>
        <li><a href="#">The Collections <span class="nav-arrow">›</span></a></li>
        <li><a href="#">Speedy <span class="nav-arrow">›</span></a></li>
        <li><a href="#">Alma <span class="nav-arrow">›</span></a></li>
        <li><a href="#">Neverfull <span class="nav-arrow">›</span></a></li>
        <li><a href="#">Noé <span class="nav-arrow">›</span></a></li>
        <li><a href="#">Keepall <span class="nav-arrow">›</span></a></li>
        <li><a href="#">Small Leather Goods <span class="nav-arrow">›</span></a></li>
      </ul>
    </nav>

  </div>

  <!-- ========== BEAUTY HEADER BLOCK ========== -->
  <div class="beauty-header-block" id="beautyHeaderBlock">

    <div class="beauty-promo-bar">
      <button class="mode-switch beauty-switch">
        <span class="switch-label active" data-value="fashion">Fashion</span>
        <span class="switch-divider">/</span>
        <span class="switch-label" data-value="beauty">Beauty</span>
      </button>
      <p class="promo-text">Radiance Begins With Ritual</p>
    </div>

    <div class="beauty-main-row">

      <div class="beauty-inner">

        <button class="nav-toggle" id="navToggleBeauty" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>

        <div class="logo-wrapper">
          <a href="/" class="site-logo beauty-logo">ÉLVOIRE</a>
        </div>

        <div class="right-wrapper">
          <button class="search-icon" id="searchToggleBeauty" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>

      </div>

      <nav class="beauty-nav-wrap" id="beautyNavWrap">
        <ul class="nav-links beauty-nav" id="beautyNav">
          <li><a href="#">New <span class="nav-arrow">›</span></a></li>
          <li><a href="#">Bestsellers <span class="nav-arrow">›</span></a></li>
          <li><a href="#">Skincare <span class="nav-arrow">›</span></a></li>
          <li><a href="#">Makeup <span class="nav-arrow">›</span></a></li>
          <li><a href="#">Rituals <span class="nav-arrow">›</span></a></li>
          <li><a href="#">The Brand <span class="nav-arrow">›</span></a></li>
        </ul>
      </nav>

    </div>

  </div>

  <!-- ========== SEARCH BOX (Shared with Hugo Form) ========== -->
  <div class="search-box" id="searchBox">
    <form class="search-form" id="searchForm" action="/search" method="GET">
      <input type="text" name="q" class="search-input" id="searchInput" placeholder="Search..." autocomplete="off">
    </form>
    <button class="search-close" id="searchClose">&times;</button>
  </div>

</header>
